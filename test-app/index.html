<script>
const KEY='dha50_engine_room_2_functional';const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const iso=()=>new Date().toISOString().slice(0,10);const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const FAMILIES={

function typeFor(n){if(/Carry|Sled Drag|Sled Push|Sled Pull/.test(n))return'carry';if(/Hold|Plank|Hang|Isometric/.test(n))return'hold';if(/Run|Bike|Rower|SkiErg|Walk|Intervals/.test(n))return'cardio';if(FAMILIES.Mobility.includes(n)||/CAR|Flow|Mobilization|Stretch|Yoga|Reset/.test(n))return'completion';return'strength'}function profileFor(n){const t=typeFor(n);if(t==='completion')return'mobility';if(/Calf|Soleus|Tibialis|Reverse Hyper|Carry|Hold|Hang|Nordic/.test(n))return'armor';if(/Flat Barbell Bench|Safety Bar Squat|Deadlift|Romanian Deadlift|Weighted Pull/.test(n))return'strength';return'hypertrophy'}
const LIB=[];Object.entries(FAMILIES).forEach(([family,names])=>names.forEach(name=>LIB.push({id:slug(name),name,family,type:typeFor(name),profile:profileFor(name)})));const get=n=>LIB.find(x=>x.name===n)||{id:slug(n),name:n,type:typeFor(n),profile:profileFor(n),family:'Program'};
function item(name,rx,pillar,profile){const fallback=pillar==='armor'?'armor':pillar==='mobility'?'mobility':pillar==='engine'?'engine':get(name).profile;return{...get(name),rx,pillar,profile:profile||fallback}}
const BASE={
0:{focus:'Run + Recovery Reset',items:[item('Outdoor Run','Runna prescription','engine'),item('Run Recovery Flow','10–12 min','mobility'),item('Calf Isometric — Straight Knee','2 × 30 sec','armor')]},
1:{focus:'Squat + Flat Bench',items:[item('Safety Bar Squat','3 × 5–8','strength','strength'),item('Flat Barbell Bench Press','4 × 6–10','strength','strength'),item('Neutral-Grip Pull-Up','3 × 6–10','strength'),item('Standing Calf Raise','3 × 8–12','armor'),item('Chest-Supported T-Bar Row','3 × 8–12','strength'),item('Tibialis Raise','2 × 15–25','armor'),item('Rope Pressdown','2 × 10–15','strength'),item('Incline Dumbbell Curl','2 × 10–15','strength'),item('Farmer Carry','3 × 30–45 sec','armor'),item('Thoracic + Ankle Reset','8 min','mobility')]},
2:{focus:'Upper Volume + Zone 2 Bike',items:[item('Dumbbell Flat Bench Press','3 × 15 base; build to 54 total reps','strength','hypertrophy'),item('Meadows Row','3 × 8–12','strength'),item('Cable Fly — Mid','2 × 12–18','strength'),item('Single-Arm Lat Pulldown','3 × 10–15','strength'),item('Cable Lateral Raise','3 × 12–20','strength'),item('Rear-Delt Cable Fly','3 × 12–20','strength'),item('Rope Pressdown','3 × 10–15','strength'),item('Hammer Curl','3 × 10–15','strength'),item('Zone 2 Bike','35–50 min','engine'),item('Hip Rotation Flow','10 min','mobility')]},
3:{focus:'Run + Posterior Chain',items:[item('Outdoor Run','Runna prescription','engine'),item('Bent-Knee Soleus Raise','2 × 12–15','armor'),item('Reverse Hyper','2 × 12–15','armor'),item('Bird Dog','2 × 6/side','armor'),item('Run Recovery Flow','8–12 min','mobility')]},
4:{focus:'Hinge + Upper + VO₂',items:[item('Romanian Deadlift','3 × 6–10','strength','strength'),item('Half-Kneeling Landmine Press','3 × 8–12','strength'),item('One-Arm Cable Row','3 × 8–12','strength'),item('Assisted Nordic Curl','2 × 4–8','armor'),item('Neutral-Grip Lat Pulldown','3 × 8–12','strength'),item('Bent-Knee Soleus Raise','3 × 12–20','armor'),item('Face Pull','2 × 12–20','armor'),item('Bayesian Cable Curl','2 × 10–15','strength'),item('Overhead Rope Extension','2 × 10–15','strength'),item('VO2 Intervals — Assault Bike','6 × 2 min / 2 min easy','engine'),item('Thoracic + Hip Reset','8 min','mobility')]},
5:{focus:'Run + Recovery',items:[item('Outdoor Run','Runna prescription','engine'),item('Backward Sled Drag','4 × 20–30 yd light','armor'),item('Tibialis Raise','2 × 20','armor'),item('YWTI','1–2 rounds','armor'),item('Run Recovery Flow','12 min','mobility')]},
6:{focus:'Athlete Day + Upper Volume + Long Ride',items:[item('Box Jump','3 × 3','armor'),item('Reverse Lunge','2–3 × 6–10/side','strength'),item('Backward Sled Drag','3 × 30–40 yd','armor'),item('Reverse Hyper','2 × 12–15','armor'),item('Weighted Push-Up','3 × 8–20','strength'),item('Chin-Up','3 × 6–12','strength'),item('Single-Arm Cable Chest Press','2 × 10–15','strength'),item('T-Bar Row','2 × 10–15','strength'),item('Dumbbell Lateral Raise','2 × 15–25','strength'),item('Sandbag Bear-Hug Carry','3 rounds','armor'),item('Outdoor Bike Ride','60–90 min Zone 2','engine'),item('Full-Body Reset Flow','10 min','mobility')]}};
function planFor(day,week){const p=JSON.parse(JSON.stringify(BASE[day]));if(day===1){const bench=p.items.find(x=>x.name==='Flat Barbell Bench Press');const schemes=['4 × 8','4 × 9','4 × 10','5 × 8','4 × 8 heavier','4 × 9','4 × 10','5 × 8','3 × 8 deload','Benchmark: best clean 8–10'];bench.rx=schemes[week-1]}if(day===4){const ix=p.items.findIndex(x=>x.pillar==='engine');const names=['VO2 Intervals — Assault Bike','VO2 Intervals — Rower','VO2 Intervals — SkiErg'];const n=names[(week-1)%3];p.items[ix]=item(n,week===10?'Reduced: 10 × 1 min / 1 min easy':week%4===0?'Reduced: 10 × 1 min / 1 min easy':'5–6 work bouts; 2–3 min each','engine')}return p}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}let S=load();S.logs=Array.isArray(S.logs)?S.logs:[];S.done=S.done||{};S.readiness=S.readiness||{};S.drafts=S.drafts||{};S.selectedDay=Number.isInteger(S.selectedDay)?S.selectedDay:new Date().getDay();S.selectedWeek=S.selectedWeek||1;function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const daySelect=document.getElementById('daySelect'),weekSelect=document.getElementById('weekSelect');daySelect.innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');weekSelect.innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');daySelect.value=S.selectedDay;weekSelect.value=S.selectedWeek;daySelect.onchange=()=>{S.selectedDay=+daySelect.value;save();renderAll()};weekSelect.onchange=()=>{S.selectedWeek=+weekSelect.value;save();renderAll()};
const key=(d,w,id)=>`${d}|${w}|${id}`;const draftKey=id=>key(S.selectedDay,S.selectedWeek,id);function latest(id){return S.logs.filter(x=>x.id===id).sort((a,b)=>b.ts-a.ts)[0]}function loggedForSelection(id){return S.logs.filter(x=>x.id===id&&x.day===S.selectedDay&&x.week===S.selectedWeek).sort((a,b)=>b.ts-a.ts)[0]}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fieldsFor(type){return type==='cardio'?['Minutes','Distance','Calories','Avg HR']:type==='carry'?['Load','Distance','Time','Trips']:type==='hold'?['Load','Seconds','Side','Notes']:['Load','Reps','RPE','Notes']}
function prescribedSets(rx){const s=String(rx||'');let m=s.match(/^\s*(\d+)\s*[–-]\s*(\d+)\s*[×xX]/);if(m)return Math.max(1,Number(m[1]));m=s.match(/^\s*(\d+)\s*[×xX]/);return m?Math.max(1,Number(m[1])):null}
function targetReps(rx){const s=String(rx||'');const m=s.match(/[×xX]\s*(\d+)/);return m?Number(m[1]):''}
function profileRules(it){if(it.profile==='strength')return{growth:.10,addSets:1,increment:5,minReset:5};if(it.profile==='armor')return{growth:.25,addSets:1,increment:5,minReset:8};return{growth:.20,addSets:1,increment:5,minReset:8}}
function numericLoad(rows){for(const r of rows||[]){const n=parseFloat(r?.[0]);if(Number.isFinite(n))return n}return null}
function actualStrength(rows){const clean=(rows||[]).filter(r=>Number(r?.[1])>0);const reps=clean.map(r=>Number(r[1])||0);return{rows:clean,sets:clean.length,reps,total:reps.reduce((a,b)=>a+b,0),min:reps.length?Math.min(...reps):0,load:numericLoad(clean)}}
function cycleFrom(last,it){if(last?.cycle)return last.cycle;const a=actualStrength(last?.rows||[]),sets=last?.baseSets||a.sets||prescribedSets(it.rx)||3,reps=last?.baseReps||Math.max(1,Math.round((last?.baseTotal||a.total||sets*(targetReps(it.rx)||8))/sets));return{baseSets:sets,baseReps:reps,baseTotal:last?.baseTotal||sets*reps,growth:profileRules(it).growth}}
function nextStrengthTarget(it,count){const last=latest(it.id),rxSets=prescribedSets(it.rx)||3,rxReps=targetReps(it.rx)||'';if(!last)return{count:rxSets,load:'',reps:rxReps,stage:'baseline'};const rules=profileRules(it),cycle=cycleFrom(last,it),lastLoad=numericLoad(last.rows),stage=last.stage||'rep-build';if(stage==='set-earned')return{count:cycle.baseSets+rules.addSets,load:lastLoad??'',reps:cycle.baseReps,stage:'set-build'};if(stage==='load-earned'){const bodyweight=/Pull-Up|Chin-Up|Push-Up/.test(it.name),nextLoad=lastLoad==null?(bodyweight?rules.increment:''):lastLoad+rules.increment,resetReps=it.profile==='strength'?(rxReps||Math.max(rules.minReset,Math.floor(cycle.baseReps*.8))):Math.max(rules.minReset,Math.floor(cycle.baseReps*.8));return{count:rxSets,load:nextLoad,reps:resetReps,stage:'new-load'};}return{count:Math.max(count||rxSets,cycle.baseSets),load:lastLoad??'',reps:rxReps||cycle.baseReps,stage:'rep-build'}}
function suggestedNonStrength(it,count){const rows=Array.from({length:count},()=>['','','','']),rx=String(it.rx||'');if(it.type==='hold'){const sec=rx.match(/(\d+)\s*sec/i)?.[1]||'';rows.forEach(r=>r[1]=sec);return rows}if(it.type==='carry'){const trips=prescribedSets(rx)||rx.match(/^\s*(\d+)\s*rounds?/i)?.[1]||'',dist=rx.match(/(\d+)\s*[–-]?\s*\d*\s*(?:yd|yard|yards|m|meter|meters)/i)?.[1]||'',time=rx.match(/(\d+)\s*[–-]?\s*\d*\s*sec/i)?.[1]||'';rows[0]=['',dist,time,trips];return rows}if(it.type==='cardio'){const simple=rx.match(/^\s*(\d+)\s*(?:[–-]\s*\d+\s*)?min/i);if(simple)rows[0][0]=simple[1];return rows}return rows}
function inputBlock(it){if(it.type==='completion')return`<button class="btn green" onclick="complete('${it.id}')">Mark Complete</button>`;const prescribed=prescribedSets(it.rx),draft=S.drafts[draftKey(it.id)],defaultCount=(it.type==='strength'||it.type==='hold')?(prescribed||3):1,count=Math.max(defaultCount,draft?.length||0),labels=fieldsFor(it.type),rows=suggestedRows(it,count);return`<div class="recommend"><b>Today's target is prefilled.</b> Change the entries to what you actually complete, then save.</div><div class="labels"><i></i>${labels.map(x=>`<b>${x}</b>`).join('')}</div><div class="sets">${Array.from({length:rows.length},(_,i)=>rowHtml(i,labels,rows[i],it.id)).join('')}</div><div class="exactions">${it.type==='strength'||it.type==='hold'?`<button class="btn" onclick="addSet(this,'${it.id}')">+ Set</button>`:''}<button class="btn primary" onclick="saveLog('${it.id}')">Save Log</button></div>`}
function rowHtml(i,labels,vals=[],id=''){return`<div class="setrow"><span>${i+1}</span>${labels.map((_,j)=>`<input value="${esc(vals?.[j]??'')}" placeholder="—" ${id?`oninput="saveDraft('${id}')"`:''}>`).join('')}</div>`}
function suggestedRows(it,count){const draft=S.drafts[draftKey(it.id)];if(Array.isArray(draft)&&draft.length)return draft;if(it.type==='strength'){const t=nextStrengthTarget(it,count);return Array.from({length:t.count},()=>[t.load,t.reps,'',''])}return suggestedNonStrength(it,count)}
function saveDraft(id){const box=document.getElementById('ex-'+id);if(!box)return;const rows=[...box.querySelectorAll('.setrow')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value));S.drafts[draftKey(id)]=rows;save();const b=document.querySelector(`[data-action="${id}"]`);if(b&&!S.done[key(S.selectedDay,S.selectedWeek,id)])b.textContent='Resume'}
function actionLabel(id){if(S.done[key(S.selectedDay,S.selectedWeek,id)]||loggedForSelection(id))return'Review';const d=S.drafts[draftKey(id)];return Array.isArray(d)&&d.some(r=>r.some(Boolean))?'Resume':'Start'}
function recommendation(it){const last=latest(it.id);if(!last)return'<b>Current stage: Baseline.</b> Complete the first session to establish your starting load and volume.';if(it.type==='completion')return'<b>Completion work.</b> Quality and consistency matter more than overload.';if(it.type!=='strength')return'<b>Current stage: Volume build.</b> Improve the prescribed time, distance, calories, trips, or clean work before adding load.';const cycle=cycleFrom(last,it),rules=profileRules(it),a=actualStrength(last.rows),target=Math.ceil(cycle.baseTotal*(1+rules.growth));if(last.stage==='set-earned')return`<b>Current stage: Set build.</b> Complete ${cycle.baseSets+rules.addSets} sets of ${cycle.baseReps} at the same load.`;if(last.stage==='load-earned'){const next=numericLoad(last.rows);return`<b>Current stage: Load earned.</b> Next session: ${next==null?'increase load':next+rules.increment} and reset to the prescribed ${prescribedSets(it.rx)||cycle.baseSets} sets.`}return`<b>Current stage: Rep build.</b> Next milestone: add ${Math.max(0,target-a.total)} total reps at this load before earning another set.`}
function toggle(id){document.getElementById('ex-'+id).classList.toggle('open')}function complete(id){S.done[key(S.selectedDay,S.selectedWeek,id)]=true;save();renderToday()}
function addSet(btn){const box=btn.closest('.exercise'),sets=box.querySelector('.sets'),labels=fieldsFor(box.dataset.type),last=sets.lastElementChild?[...sets.lastElementChild.querySelectorAll('input')].map(x=>x.value):[];sets.insertAdjacentHTML('beforeend',rowHtml(sets.children.length,labels,last,box.id.replace('ex-','')));saveDraft(box.id.replace('ex-',''))}
function saveLog(id){const it=planFor(S.selectedDay,S.selectedWeek).items.find(x=>x.id===id)||get(id);const box=document.getElementById('ex-'+id),rows=[...box.querySelectorAll('.setrow')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value));const prev=latest(id);let stage='rep-build',cycle=null,baseTotal=null,baseSets=null,baseReps=null;if(it.type==='strength'){const a=actualStrength(rows),rules=profileRules(it);if(!prev){baseSets=a.sets||prescribedSets(it.rx)||3;baseReps=a.sets?Math.max(1,Math.round(a.total/a.sets)):(targetReps(it.rx)||8);baseTotal=baseSets*baseReps;cycle={baseSets,baseReps,baseTotal,growth:rules.growth};stage=a.total>=Math.ceil(baseTotal*(1+rules.growth))?'set-earned':'rep-build'}else{cycle=cycleFrom(prev,it);baseSets=cycle.baseSets;baseReps=cycle.baseReps;baseTotal=cycle.baseTotal;const repTarget=Math.ceil(baseTotal*(1+rules.growth));if(prev.stage==='set-earned'){const addedTarget=cycle.baseSets+rules.addSets;stage=(a.sets>=addedTarget&&a.min>=cycle.baseReps)?'load-earned':'set-earned'}else if(prev.stage==='load-earned'){baseSets=a.sets||prescribedSets(it.rx)||cycle.baseSets;baseReps=a.sets?Math.max(1,Math.round(a.total/a.sets)):(targetReps(it.rx)||cycle.baseReps);baseTotal=baseSets*baseReps;cycle={baseSets,baseReps,baseTotal,growth:rules.growth};stage=a.total>=Math.ceil(baseTotal*(1+rules.growth))?'set-earned':'rep-build'}else stage=a.total>=repTarget?'set-earned':'rep-build'}}const rec={uid:crypto.randomUUID?crypto.randomUUID():String(Date.now()),ts:Date.now(),date:iso(),day:S.selectedDay,week:S.selectedWeek,id:it.id,name:it.name,type:it.type,profile:it.profile,rx:it.rx,rows,baseTotal,baseSets,baseReps,cycle,stage,summary:summarize(it.type,rows)};S.logs.push(rec);S.done[key(S.selectedDay,S.selectedWeek,id)]=true;delete S.drafts[draftKey(id)];save();renderAll();alert('Logged')}
function summarize(type,rows){if(type==='strength')return`${rows[0]?.[0]||'—'} · ${rows.map(r=>r[1]).filter(Boolean).join('/')||'logged'}`;return rows[0].filter(Boolean).join(' · ')||'logged'}
function renderToday(){const p=planFor(S.selectedDay,S.selectedWeek),rd=S.readiness[`${S.selectedDay}|${S.selectedWeek}`];let h=`<div class="hero"><div class="eyebrow">${DAYS[S.selectedDay]} · Week ${S.selectedWeek} of 10</div><h2>${p.focus}</h2><p>Build reps → add a set → increase load → reset volume.</p><div class="readiness">${['green','yellow','red'].map(x=>`<button class="ready ${x} ${rd===x?'active':''}" onclick="ready('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>`;for(const pillar of ['strength','engine','armor','mobility']){const arr=p.items.filter(x=>x.pillar===pillar);if(!arr.length)continue;h+=`<div class="sectiontitle"><h3>${pillar[0].toUpperCase()+pillar.slice(1)}</h3><span>${arr.filter(x=>S.done[key(S.selectedDay,S.selectedWeek,x.id)]).length}/${arr.length}</span></div>`;arr.forEach(it=>{const done=S.done[key(S.selectedDay,S.selectedWeek,it.id)],last=latest(it.id);h+=`<div class="mission"><div class="missionhead" onclick="toggle('${it.id}')"><span class="dot ${pillar}"></span><div><strong>${it.name}</strong><small>${it.rx}</small></div><button data-action="${it.id}" class="toggle ${done?'done':''}" onclick="event.stopPropagation();toggle('${it.id}')">${actionLabel(it.id)}</button></div><div class="exercise" data-type="${it.type}" id="ex-${it.id}"><div class="exhead"><div><div class="exname">${it.name}</div><div class="rx">${it.rx}</div></div><div class="stage">${it.profile}</div></div><div class="last">${last?'<b>Last session:</b> '+last.date+' · '+last.summary:'No history yet'}</div>${inputBlock(it)}<div class="recommend">${recommendation(it)}</div></div></div>`})}document.getElementById('today').innerHTML=h}
function ready(v){S.readiness[`${S.selectedDay}|${S.selectedWeek}`]=v;save();renderToday()}
function renderWeek(){document.getElementById('week').innerHTML=`<div class="hero"><div class="eyebrow">Week ${S.selectedWeek} operations</div><h2>Choose any day</h2><p>Tap a day to open its complete workout in the Engine Room.</p></div>${DAYS.map((d,i)=>{const p=planFor(i,S.selectedWeek);return`<div class="daycard ${i===S.selectedDay?'selected':''}" onclick="chooseDay(${i})"><div class="daytop"><strong>${d}</strong><small>${p.items.length} items</small></div><div class="dayfocus">${p.focus}</div><div class="pillrow">${[...new Set(p.items.map(x=>x.pillar))].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`}).join('')}`}
function chooseDay(i){S.selectedDay=i;daySelect.value=i;save();renderAll();switchTab('today')}
function renderLibrary(){const q=(document.getElementById('libSearch')?.value||'').toLowerCase(),fam=document.getElementById('famFilter')?.value||'all';const groups={};LIB.filter(x=>(fam==='all'||x.family===fam)&&(!q||x.name.toLowerCase().includes(q))).forEach(x=>(groups[x.family]??=[]).push(x));document.getElementById('library').innerHTML=`<div class="hero"><div class="eyebrow">Jay-approved movement catalog</div><h2>${LIB.length} movements</h2><p>All compatible with your equipment and preferences.</p></div><div class="sectiontitle"><h3>Armory</h3></div><div class="librarytools"><input id="libSearch" placeholder="Search" value="${esc(q)}" oninput="renderLibrary()"><select id="famFilter" onchange="renderLibrary()"><option value="all">All families</option>${Object.keys(FAMILIES).map(f=>`<option ${fam===f?'selected':''}>${f}</option>`).join('')}</select></div>${Object.entries(groups).map(([f,a])=>`<div class="family"><h3>${f}</h3>${a.map(x=>`<div class="libitem" onclick="openManual('${x.id}')"><div><strong>${x.name}</strong><small>${x.type} · ${x.profile}</small></div><span class="tag">LOG +</span></div>`).join('')}</div>`).join('')}`}
function renderProgress(){const logs=[...S.logs].sort((a,b)=>b.ts-a.ts);document.getElementById('progress').innerHTML=`<div class="hero"><div class="eyebrow">Performance tracker</div><h2>Logbook</h2><p>Record any workout movement, carry, hold, run, ride, or erg session.</p><button class="btn primary" style="margin-top:12px;width:100%" onclick="openManual()">+ Record Activity</button></div><div class="sectiontitle"><h3>Snapshot</h3></div><div class="stats"><div class="stat"><b>${logs.filter(x=>x.week===S.selectedWeek).length}</b><small>logs in selected week</small></div><div class="stat"><b>${new Set(logs.map(x=>x.id)).size}</b><small>movements tracked</small></div><div class="stat"><b>${logs.length}</b><small>total logs</small></div><div class="stat"><b>${Object.keys(S.done).length}</b><small>completed items</small></div></div><div class="sectiontitle"><h3>History</h3></div>${logs.length?`<div class="history">${logs.slice(0,50).map(x=>`<div class="histrow"><span>${x.date}</span><span>${x.name}<br><small>W${x.week} · ${DAYS[x.day]}</small></span><span>${x.summary}</span></div>`).join('')}</div>`:'<div class="empty">No logs yet. Tap “Record Activity” or open an exercise in today’s workout.</div>'}`}
function openManual(pre=''){const selected=LIB.find(x=>x.id===pre);document.getElementById('sheet').innerHTML=`<h3>Record Activity</h3><label>Movement<select id="manualMove">${LIB.map(x=>`<option value="${x.id}" ${selected?.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><div id="manualFields" style="margin-top:12px"></div><div class="footeractions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManual()">Save</button></div>`;document.getElementById('modal').classList.add('show');document.getElementById('manualMove').onchange=renderManualFields;renderManualFields()}
function renderManualFields(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),labels=fieldsFor(it.type),count=it.type==='strength'?3:1;document.getElementById('manualFields').innerHTML=`<div class="labels"><i></i>${labels.map(x=>`<b>${x}</b>`).join('')}</div><div class="sets" id="manualRows">${Array.from({length:count},(_,i)=>rowHtml(i,labels)).join('')}</div>${it.type==='strength'?'<button class="btn" style="margin-top:8px" onclick="manualAddSet()">+ Set</button>':''}`}
function manualAddSet(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),box=document.getElementById('manualRows');box.insertAdjacentHTML('beforeend',rowHtml(box.children.length,fieldsFor(it.type)))}
function saveManual(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),rows=[...document.querySelectorAll('#manualRows .setrow')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value));S.logs.push({uid:String(Date.now()),ts:Date.now(),date:iso(),day:S.selectedDay,week:S.selectedWeek,id:it.id,name:it.name,type:it.type,profile:it.profile,rx:'Manual log',rows,baseTotal:it.type==='strength'?rows.reduce((a,r)=>a+(+r[1]||0),0):null,stage:'rep-build',summary:summarize(it.type,rows)});save();closeModal();renderProgress();switchTab('progress')}
function showSettings(){document.getElementById('sheet').innerHTML=`<h3>Configuration</h3><p style="color:var(--muted)">Selected week and day are saved automatically. Data remains on this device.</p><div class="footeractions"><button class="btn" onclick="exportData()">Export</button><button class="btn" onclick="document.getElementById('imp').click()">Import</button></div><input id="imp" hidden type="file" accept="application/json" onchange="importData(event)"><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetData()">Reset All Data</button><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.add('show')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`dha50-engine-room-${iso()}.json`;a.click()}function importData(e){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete all Engine Room data?')){localStorage.removeItem(KEY);location.reload()}}function closeModal(){document.getElementById('modal').classList.remove('show')}
function switchTab(id){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));document.querySelector(`.tab[data-tab="${id}"]`).classList.add('active');document.getElementById(id).classList.add('active')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById('settingsBtn').onclick=showSettings;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function renderAll(){renderToday();renderWeek();renderLibrary();renderProgress()}renderAll();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
