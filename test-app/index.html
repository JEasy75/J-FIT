function ungroupItem(idx){const day=S.selectedDay,week=S.selectedWeek,gkey=`${day}|${week}`;if(!S.groups[gkey])return;S.groups[gkey]=S.groups[gkey].map(g=>g.filter(i=>i!==idx)).filter(g=>g.length>1);save();closeModal();renderAll()}
function cardHtml(it,pillar,posArr){const done=S.done[key(S.selectedDay,S.selectedWeek,it.id)],last=latest(it.id),swapped=it._original&&it._original!==it.name,pos=posArr.findIndex(x=>x._idx===it._idx),canUp=pos>0,canDown=pos<posArr.length-1;return`<div class="mission"><div class="missionhead" onclick="toggle('${it.id}')"><span class="dot ${pillar}"></span><div><strong>${it.name}</strong><small>${displayPrescription(it)}${swapped?` <em style="color:var(--amber);font-style:normal">· swapped</em>`:''}</small></div><button data-action="${it.id}" class="toggle ${done?'done':''}" onclick="event.stopPropagation();toggle('${it.id}')">${actionLabel(it.id)}</button></div><div class="exercise" data-type="${it.type}" id="ex-${it.id}"><div class="exhead"><div><div class="exname">${it.name}</div><div class="rx">${displayPrescription(it)}</div></div><div class="stage">${it.profile}</div></div><div class="cardtools"><button class="btn" ${canUp?'':'disabled'} onclick="event.stopPropagation();moveItem(${it._idx},'${pillar}',-1)">↑</button><button class="btn" ${canDown?'':'disabled'} onclick="event.stopPropagation();moveItem(${it._idx},'${pillar}',1)">↓</button><button class="btn" onclick="event.stopPropagation();openGroup(${it._idx})">Group</button><button class="btn" onclick="event.stopPropagation();openSwap(${it._idx})">Swap</button></div><div class="last">${last?'<b>Last session:</b> '+last.date+' · '+last.summary:'No history yet'}</div>${inputBlock(it)}</div></div>`}
function hardBulletCount(week){return 1+(S.hardDays[week]||[]).length}
function isHardDay(day,week){return(S.hardDays[week]||[]).includes(day)}
function toggleHardDay(day,week){const arr=S.hardDays[week]||[];S.hardDays[week]=arr.includes(day)?arr.filter(d=>d!==day):[...arr,day];save();renderAll()}
function renderToday(){const p=planFor(S.selectedDay,S.selectedWeek),rd=S.readiness[`${S.selectedDay}|${S.selectedWeek}`],isRunDay=[0,3,5].includes(S.selectedDay),hardCount=hardBulletCount(S.selectedWeek),hardColor=hardCount>2?'var(--red)':hardCount===2?'var(--amber)':'var(--muted)';let h=`<div class="hero"><div class="eyebrow">${DAYS[S.selectedDay]} · Week ${S.selectedWeek} of 10</div><h2>${p.focus}</h2><p>Build reps → add a set → increase load → reset volume.</p><div class="readiness">${['green','yellow','red'].map(x=>`<button class="ready ${x} ${rd===x?'active':''}" onclick="ready('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div style="margin-top:12px;font-size:11px;color:${hardColor}">Hard cardio stressors this week: ${hardCount}/2${hardCount>2?' — over your own limit, keep other days easy':''}${S.selectedDay===4?' <span style="color:var(--muted)">(Thursday VO2 counts automatically)</span>':''}</div>${isRunDay?`<div style="margin-top:8px"><button class="btn ${isHardDay(S.selectedDay,S.selectedWeek)?'primary':''}" style="font-size:11px;padding:6px 10px" onclick="toggleHardDay(${S.selectedDay},${S.selectedWeek})">${isHardDay(S.selectedDay,S.selectedWeek)?'✓ Runna assigned hard efforts today':'Mark today as a hard Runna day'}</button></div>`:''}</div>`;let groupLetter=0;for(const pillar of ['strength','engine','armor','mobility']){let arr=p.items.filter(x=>x.pillar===pillar);if(!arr.length)continue;arr=applyOrder(S.selectedDay,S.selectedWeek,pillar,arr);h+=`<div class="sectiontitle"><h3>${pillar[0].toUpperCase()+pillar.slice(1)}</h3><span>${arr.filter(x=>S.done[key(S.selectedDay,S.selectedWeek,x.id)]).length}/${arr.length}</span></div>`;const clusters=clusterGroups(S.selectedDay,S.selectedWeek,arr);clusters.forEach(cluster=>{if(cluster.length===1){h+=cardHtml(cluster[0],pillar,arr)}else{const label=cluster.length>=3?'Giant Set':'Superset',letter=String.fromCharCode(65+groupLetter++);h+=`<div class="superset"><div class="supersetlabel">${label} ${letter} · ${cluster.length} exercises, back-to-back</div>${cluster.map(it=>cardHtml(it,pillar,arr)).join('')}</div>`}})}document.getElementById('today').innerHTML=h}
function ready(v){S.readiness[`${S.selectedDay}|${S.selectedWeek}`]=v;save();renderToday()}
function renderWeek(){document.getElementById('week').innerHTML=`<div class="hero"><div class="eyebrow">Week ${S.selectedWeek} operations</div><h2>Choose any day</h2><p>Tap a day to open its complete workout in the Engine Room.</p></div>${DAYS.map((d,i)=>{const p=planFor(i,S.selectedWeek);return`<div class="daycard ${i===S.selectedDay?'selected':''}" onclick="chooseDay(${i})"><div class="daytop"><strong>${d}</strong><small>${p.items.length} items</small></div><div class="dayfocus">${p.focus}</div><div class="pillrow">${[...new Set(p.items.map(x=>x.pillar))].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`}).join('')}`}
function chooseDay(i){S.selectedDay=i;daySelect.value=i;save();renderAll();switchTab('today')}
function renderLibrary(){const q=(document.getElementById('libSearch')?.value||'').toLowerCase(),fam=document.getElementById('famFilter')?.value||'all';const groups={};LIB.filter(x=>(fam==='all'||x.family===fam)&&(!q||x.name.toLowerCase().includes(q))).forEach(x=>(groups[x.family]??=[]).push(x));document.getElementById('library').innerHTML=`<div class="hero"><div class="eyebrow">Jay-approved movement catalog</div><h2>${LIB.length} movements</h2><p>All compatible with your equipment and preferences.</p></div><div class="sectiontitle"><h3>Armory</h3></div><div class="librarytools"><input id="libSearch" placeholder="Search" value="${esc(q)}" oninput="renderLibrary()"><select id="famFilter" onchange="renderLibrary()"><option value="all">All families</option>${Object.keys(FAMILIES).map(f=>`<option ${fam===f?'selected':''}>${f}</option>`).join('')}</select></div>${Object.entries(groups).map(([f,a])=>`<div class="family"><h3>${f}</h3>${a.map(x=>`<div class="libitem" onclick="openHistory('${x.id}')"><div><strong>${x.name}</strong><small>${x.type} · ${x.profile}</small></div><span class="tag">HISTORY</span></div>`).join('')}</div>`).join('')}`}
function miniTrend(arr,unit){const sorted=[...arr].sort((a,b)=>a.ts-b.ts),vals=sorted.map(x=>x.value),last=sorted[sorted.length-1],prev=sorted[sorted.length-2],delta=last&&prev?+(last.value-prev.value).toFixed(1):null;return`${last?`<b style="font-size:20px">${last.value}${unit}</b> <small style="color:var(--muted)">${last.date}</small>`:'<small style="color:var(--faint)">No entries yet</small>'}${delta!=null?`<div style="font-size:11px;color:${delta<0?'var(--green)':delta>0?'var(--amber)':'var(--muted)'}">${delta>0?'+':''}${delta}${unit} vs prior</div>`:''}${vals.length>=2?sparkline(vals):''}`}
function addBodyLog(){const v=parseFloat(document.getElementById('bodyInput').value),d=document.getElementById('bodyDate')?.value||iso();if(!v)return;S.bodyLogs.push({date:d,ts:new Date(d+'T12:00:00').getTime()||Date.now(),value:v});save();renderProgress()}
function addVo2Log(){const v=parseFloat(document.getElementById('vo2Input').value),d=document.getElementById('vo2Date')?.value||iso();if(!v)return;S.vo2Logs.push({date:d,ts:new Date(d+'T12:00:00').getTime()||Date.now(),value:v});save();renderProgress()}
const ENGINE_TREND_MOVES=['Outdoor Run','Zone 2 Bike','Outdoor Bike Ride','VO2 Intervals — Assault Bike','VO2 Intervals — Rower','VO2 Intervals — SkiErg'];
function renderProgress(){const logs=[...S.logs].sort((a,b)=>b.ts-a.ts);document.getElementById('progress').innerHTML=`<div class="hero"><div class="eyebrow">Performance tracker</div><h2>Logbook</h2><p>Record any workout movement, carry, hold, run, ride, or erg session.</p><button class="btn primary" style="margin-top:12px;width:100%" onclick="openManual()">+ Record Activity</button></div><div class="sectiontitle"><h3>Snapshot</h3></div><div class="stats"><div class="stat"><b>${logs.filter(x=>x.week===S.selectedWeek).length}</b><small>logs in selected week</small></div><div class="stat"><b>${new Set(logs.map(x=>x.id)).size}</b><small>movements tracked</small></div><div class="stat"><b>${logs.length}</b><small>total logs</small></div><div class="stat"><b>${Object.keys(S.done).length}</b><small>completed items</small></div></div><div class="sectiontitle"><h3>Body &amp; Engine</h3><span>manual, whenever you have a number</span></div><div class="mission" style="padding:12px"><strong>Bodyweight</strong>${miniTrend(S.bodyLogs,' lb')}<div style="display:flex;gap:6px;margin-top:10px"><input id="bodyDate" type="date" value="${iso()}" max="${iso()}" style="flex:1"><input id="bodyInput" type="number" step="0.1" placeholder="lb" style="flex:1"><button class="btn primary" onclick="addBodyLog()">Log</button></div></div><div class="mission" style="padding:12px;margin-top:8px"><strong>Garmin VO2max</strong>${miniTrend(S.vo2Logs,'')}<div style="display:flex;gap:6px;margin-top:10px"><input id="vo2Date" type="date" value="${iso()}" max="${iso()}" style="flex:1"><input id="vo2Input" type="number" step="0.1" placeholder="e.g. 43" style="flex:1"><button class="btn primary" onclick="addVo2Log()">Log</button></div></div><div class="sectiontitle"><h3>Engine Trend</h3><span>pace/output vs HR</span></div><div class="pillrow" style="margin-bottom:6px">${ENGINE_TREND_MOVES.map(n=>`<span class="pill" style="cursor:pointer" onclick="openHistory('${slug(n)}')">${n}</span>`).join('')}</div><div class="sectiontitle"><h3>History</h3></div>${logs.length?`<div class="history">${logs.slice(0,50).map(x=>`<div class="histrow"><span>${x.date}</span><span>${x.name}<br><small>W${x.week} · ${DAYS[x.day]}</small></span><span>${x.summary}</span></div>`).join('')}</div>`:'<div class="empty">No logs yet. Tap “Record Activity” or open an exercise in today’s workout.</div>'}`}
function openHistory(id){const it=LIB.find(x=>x.id===id);if(!it)return;const series=metricSeries(id),vals=series.map(s=>s.v).filter(v=>v!=null);document.getElementById('sheet').innerHTML=`<h3>${it.name}</h3><p style="color:var(--muted);font-size:12px;margin-top:-8px">${metricLabel(it.type)} over time</p>${vals.length>=2?sparkline(vals):'<p style="color:var(--faint);font-size:12px">Not enough logs yet for a trend.</p>'}<div class="history" style="margin-top:12px">${series.length?[...series].reverse().slice(0,20).map(s=>`<div class="histrow"><span>${s.date}</span><span>${s.summary}</span><span>${s.v??''}${s.hr?` @ ${s.hr}bpm`:''}</span></div>`).join(''):'<div class="empty">No logs yet.</div>'}</div><div class="footeractions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="openManual('${id}')">+ Log New</button></div>`;document.getElementById('modal').classList.add('show')}
function openManual(pre=''){const selected=LIB.find(x=>x.id===pre);document.getElementById('sheet').innerHTML=`<h3>Record Activity</h3><label>Movement<select id="manualMove">${LIB.map(x=>`<option value="${x.id}" ${selected?.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label style="display:block;margin-top:10px">Date<input type="date" id="manualDate" value="${iso()}" max="${iso()}"></label><div id="manualFields" style="margin-top:12px"></div><div class="footeractions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManual()">Save</button></div>`;document.getElementById('modal').classList.add('show');document.getElementById('manualMove').onchange=renderManualFields;renderManualFields()}
function renderManualFields(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),labels=fieldsFor(it.type),count=it.type==='strength'?3:1;document.getElementById('manualFields').innerHTML=`<div class="labels"><i></i>${labels.map(x=>`<b>${x}</b>`).join('')}</div><div class="sets" id="manualRows">${Array.from({length:count},(_,i)=>rowHtml(i,labels)).join('')}</div>${it.type==='strength'?'<button class="btn" style="margin-top:8px" onclick="manualAddSet()">+ Set</button>':''}`}
function manualAddSet(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),box=document.getElementById('manualRows');box.insertAdjacentHTML('beforeend',rowHtml(box.children.length,fieldsFor(it.type)))}
function saveManual(){const it=LIB.find(x=>x.id===document.getElementById('manualMove').value),rows=[...document.querySelectorAll('#manualRows .setrow')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value)),logDate=document.getElementById('manualDate')?.value||iso();S.logs.push({uid:String(Date.now()),ts:new Date(logDate+'T12:00:00').getTime()||Date.now(),date:logDate,day:S.selectedDay,week:S.selectedWeek,id:it.id,name:it.name,type:it.type,profile:it.profile,rx:'Manual log',rows,baseTotal:it.type==='strength'?rows.reduce((a,r)=>a+(+r[1]||0),0):null,stage:'rep-build',summary:summarize(it.type,rows)});save();closeModal();renderProgress();switchTab('progress')}
function showSettings(){const days=S.lastExport?Math.floor((Date.now()-S.lastExport)/86400000):null;const warn=days==null?'<p style="color:var(--amber);font-size:12px;margin-top:8px">No backup on file yet — your history only exists on this device. Export one now.</p>':days>=30?`<p style="color:var(--amber);font-size:12px;margin-top:8px">Last backup was ${days} days ago. Worth exporting a fresh one.</p>`:`<p style="color:var(--muted);font-size:12px;margin-top:8px">Last backup: ${days} day(s) ago.</p>`;document.getElementById('sheet').innerHTML=`<h3>Configuration</h3><p style="color:var(--muted);font-size:12px;margin-top:-6px">App version: ${APP_VERSION}</p><p style="color:var(--muted)">Selected week and day are saved automatically. Data remains on this device — code updates never touch it, but clearing browser data or switching devices will. Export periodically as your off-device backup.</p>${warn}<div class="footeractions"><button class="btn" onclick="exportData()">Export</button><button class="btn" onclick="document.getElementById('imp').click()">Import</button></div><input id="imp" hidden type="file" accept="application/json" onchange="importData(event)"><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetData()">Reset All Data</button><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.add('show')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`dha50-engine-room-${APP_VERSION}-${iso()}.json`;a.click();S.lastExport=Date.now();save()}function importData(e){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete all Engine Room data?')){localStorage.removeItem(KEY);location.reload()}}function closeModal(){document.getElementById('modal').classList.remove('show')}
function switchTab(id){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));document.querySelector(`.tab[data-tab="${id}"]`).classList.add('active');document.getElementById(id).classList.add('active')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById('settingsBtn').onclick=showSettings;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function renderAll(){renderToday();renderWeek();renderLibrary();renderProgress()}renderAll();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
