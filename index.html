*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:780px;margin:auto;padding:0 14px 100px}.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px 10px;background:rgba(20,17,15,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.mark{background:var(--amber);color:#17120e;font-weight:900;letter-spacing:.13em;padding:7px 9px;border-radius:5px}.brand h1{font-size:19px;margin:0}.brand p{font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.16em;margin:2px 0 0;font-weight:800}.brandcopy{min-width:0}.version{color:var(--muted);font-weight:700;font-size:.72em}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tablabel{font-size:10px}.missionicon{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--bg2);flex:0 0 auto}.missionicon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.missionicon.strength{color:var(--amber)}.missionicon.engine{color:var(--blue)}.missionicon.armor{color:var(--green)}.missionicon.mobility{color:var(--purple)}.date{margin-left:auto;color:var(--muted);font-size:12px}.blockbar{display:flex;align-items:center;gap:8px;margin-top:10px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 9px;font-size:11px}.chip strong{color:var(--txt)}.spacer{flex:1}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:7px 10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.tab{border:1px solid var(--line);background:var(--bg2);color:var(--muted);padding:9px 3px;border-radius:9px;font-size:12px;font-weight:750}.tab.active{border-color:var(--amber);color:var(--amber);background:var(--panel)}.panel{display:none}.panel.active{display:block}.hero{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.eyebrow{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.16em}.hero h2{font-size:26px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.readiness{display:flex;gap:6px;margin-top:12px}.ready{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--muted);padding:8px;border-radius:8px;font-weight:800}.ready.active.green{border-color:var(--green);color:var(--green)}.ready.active.yellow{border-color:var(--amber);color:var(--amber)}.ready.active.red{border-color:var(--red);color:var(--red)}.sectiontitle{display:flex;align-items:end;margin:18px 2px 8px}.sectiontitle h3{margin:0;font-size:16px}.sectiontitle span{margin-left:auto;color:var(--faint);font-size:11px}.mission{border:1px solid var(--line);background:var(--panel);border-radius:12px;margin:8px 0;overflow:hidden}.missionhead{display:flex;align-items:center;gap:10px;padding:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}.dot.strength{background:var(--amber)}.dot.engine{background:var(--blue)}.dot.armor{background:var(--green)}.dot.mobility{background:var(--purple)}.missionhead strong{display:block}.missionhead small{display:block;color:var(--muted);margin-top:2px}.missionhead button{margin-left:auto}.toggle{border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:8px;padding:7px 9px}.toggle.done{border-color:var(--green);color:var(--green)}.exercise{border-top:1px solid var(--line);padding:12px}.exercise:first-child{border-top:0}.exhead{display:flex;gap:8px;align-items:flex-start}.exname{font-weight:8 :0}.libitem strong{display:block;font-size:13px}.libitem small{display:block;color:var(--faint);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{margin-left:auto;font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}.stat b{font-size:24px}.stat small{display:block;color:var(--muted)}.history{border:1px solid var(--line);border-radius:10px;overflow:hidden}.histrow{display:grid;grid-template-columns:90px 1fr 75px;gap:8px;padding:9px;border-top:1px solid var(--line);font-size:12px}.histrow:first-child{border-top:0}.histrow span:last-child{text-align:right;color:var(--amber)}.empty{color:var(--muted);text-align:center;padding:28px 10px}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:780px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid .full{grid-column:1/-1}.note{font-size:11px;color:var(--muted)}.footeractions{display:flex;gap:8px;margin-top:14px}.footeractions .btn{flex:1}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}.stats{grid-template-columns:repeat(4,1fr)}}
</style>

<body><div class="app">
<header class="top"><div class="brand"><div class="mark">DHA-50</div><div class="brandcopy"><h1>Engine Room <span class="version">2.0</span></h1><p>Build. Forge. Expand.</p></div><div class="date" id="dateLabel"></div></div><div class="blockbar"><div class="chip"><strong>Block:</strong> Flat Bench · 10 weeks</div><div class="chip" id="weekChip"><strong>Week 1</strong></div><div class="spacer"></div><button class="iconbtn" id="settingsBtn" aria-label="Configuration">⚙︎</button></div></header>

<script>
const KEY='dha50_engine_v2';
const todayISO=()=>new Date().toISOString().slice(0,10);const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const FAMILIES={
'Horizontal Push':['Flat Barbell Bench Press','Swiss Bar Bench Press','Close-Grip Barbell Bench','Close-Grip Swiss Bar Bench','Dumbbell Flat Bench Press','Dumbbell Neutral-Grip Bench Press','Dumbbell Floor Press','Swiss Bar Floor Press','Push-Up','Weighted Push-Up','Feet-Elevated Push-Up','Deficit Push-Up','Ares Cable Chest Press','Single-Arm Cable Chest Press','Cable Fly — Mid','Cable Fly — Low-to-High','Cable Fly — High-to-Low'],
'Angled / Vertical Push':['Low-Incline Dumbbell Press','Incline Dumbbell Press','Incline Barbell Bench Press','Incline Swiss Bar Bench Press','Half-Kneeling Landmine Press','Standing Landmine Press','Viking Press','Standing Dumbbell Press','Single-Arm Dumbbell Press','Cable Y-Raise','Cable Scaption'],
'Horizontal Pull':['T-Bar Row','Chest-Supported T-Bar Row','Meadows Row','Landmine Row','One-Arm Dumbbell Row','Chest-Supported Dumbbell Row','Seated Cable Row','Chest-Supported Cable Row','Standing Bent Cable Row','One-Arm Cable Row','Half-Kneeling Cable Row','Seal Row','Barbell Bent Row','Pendlay Row','Rear-Delt Cable Row'],
'Vertical Pull':['Pull-Up','Neutral-Grip Pull-Up','Chin-Up','Weighted Pull-Up','Weighted Chin-Up','Band-Assisted Pull-Up','Wide-Grip Lat Pulldown','Neutral-Grip Lat Pulldown','Close-Grip Pulldown','Single-Arm Lat Pulldown','Half-Kneeling Single-Arm Pulldown','Straight-Arm Pulldown','Cable Pullover','Scapular Pull-Up'],
'Squat / Knee Dominant':['Safety Bar Squat','Hatfield Safety Bar Squat','Back Squat','Front Squat','Goblet Squat','Box Squat','Heels-Elevated Goblet Squat','Reverse Lunge','Walking Lunge','Front-Foot-Elevated Split Squat','Rear-Foot-Elevated Split Squat','Step-Up','Lateral Step-Up','Controlled Step-Down','Lateral Lunge','Cossack Squat'],
'Hinge / Posterior Chain':['Open Trap Bar Deadlift','Romanian Deadlift','Dumbbell Romanian Deadlift','Single-Leg Romanian Deadlift','B-Stance Romanian Deadlift','Landmine Romanian Deadlift','Good Morning','Seated Zercher Good Morning','Hip Thrust','Barbell Glute Bridge','Reverse Hyper','Nordic Curl','Assisted Nordic Curl','Glute-Ham Raise','Hamstring Walkout','Cable Pull-Through'],
'Calves / Feet':['Standing Calf Raise','Single-Leg Standing Calf Raise','Bent-Knee Soleus Raise','Single-Leg Soleus Raise','Tibialis Raise','Single-Leg Tibialis Raise','Toe Yoga','Short-Foot Drill','Calf Isometric — Straight Knee','Soleus Isometric — Bent Knee'],
'Delts / Shoulder Armor':['Dumbbell Lateral Raise','Cable Lateral Raise','Lean-Away Cable Lateral Raise','Rear-Delt Cable Fly','Rear-Delt Dumbbell Fly','Face Pull','Cable External Rotation','Band External Rotation','Wall Slide','YWTI','Shoulder CAR','Scapular CAR','Scapular Push-Up'],
'Arms':['Incline Dumbbell Curl','Bayesian Cable Curl','Hammer Curl','Cross-Body Hammer Curl','EZ-Bar Curl','Cable Curl','Rope Curl','Rope Pressdown','Straight-Bar Pressdown','Overhead Rope Extension','Cross-Body Cable Extension','Close-Grip Push-Up'],
'Core / Armor':['Pallof Press','Pallof Walkout','Dead Bug','Bird Dog','McGill Curl-Up','Side Plank','Copenhagen Plank','Cable Chop','Cable Lift','Ab Wheel Rollout','Suitcase Hold','Offset Barbell Hold'],
'Carries':['Farmer Carry','Suitcase Carry','Asymmetrical Farmer Carry','Front-Rack Carry','Waiter Carry','Sandbag Bear-Hug Carry','Sandbag Front Carry','Zercher Carry','Med-Ball Bear-Hug Carry'],
'Sled / Power':['Heavy Sled Push','Backward Sled Drag','Forward Sled Drag','Lateral Sled Drag','Sled Rope Pull','Hand-over-Hand Sled Pull','Box Jump','Broad Jump','Frog Jump','Skater Jump','Medicine-Ball Chest Pass','Medicine-Ball Scoop Toss'],
'Engine':['Outdoor Run','Outdoor Bike Ride','Assault Bike','Rower','SkiErg','Recovery Walk','Zone 2 Bike','VO2 Intervals — Assault Bike','VO2 Intervals — Rower','VO2 Intervals — SkiErg'],
'Mobility':['90/90 Hip Switch','90/90 Internal-Rotation Lift','Supported Hip CAR','Wall Hip CAR','Hip Airplane','Adductor Rock-Back','Knee-to-Wall Ankle Mobilization','Deep Squat Breathing','Couch Stretch','Hamstring Floss','Open-Book Rotation','Thoracic Extension on Foam Roller','Passive Hang','Morning Reset Flow','Hip Rotation Flow','Run Recovery Flow','Full-Body Reset Flow']};
const defaultType=n=>{if(/Carry/.test(n))return'carry';if(/Hold|Plank|Hang|Isometric/.test(n))return'hold';if(/Run|Bike|Rower|SkiErg|Walk|Intervals/.test(n))return'cardio';if(FAMILIES.Mobility.includes(n)||/CAR|Flow|Mobilization|Stretch|Yoga|Short-Foot/.test(n))return'completion';return'strength'};
const defaultProfile=n=>{if(/Calf|Soleus|Tibialis|Reverse Hyper|Carry|Hold|Hang/.test(n))return'armor';if(/Bench Press|Safety Bar Squat|Deadlift|Romanian Deadlift|Pull-Up/.test(n))return'strength';return'hypertrophy'};
const LIB=[];Object.entries(FAMILIES).forEach(([family,names])=>names.forEach(name=>LIB.push({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,family,type:defaultType(name),profile:defaultProfile(name)})));
const weekPlan={
0:{focus:'Run + Recovery Reset',items:[m('Outdoor Run','engine','Runna prescription','cardio'),m('Run Recovery Flow','mobility','10–12 min','completion'),m('Calf Isometric — Straight Knee','armor','2 × 30 sec','hold')]},
1:{focus:'Squat + Flat Bench',items:[x('Safety Bar Squat','3 × 5–8','strength'),x('Flat Barbell Bench Press','4 × 6–10','strength'),x('Neutral-Grip Pull-Up','3 × 6–10','hypertrophy'),x('Standing Calf Raise','3 × 8–12','armor'),x('Chest-Supported T-Bar Row','3 × 8–12','hypertrophy'),x('Tibialis Raise','2 × 15–25','armor'),x('Rope Pressdown','2 × 10–15','hypertrophy'),x('Incline Dumbbell Curl','2 × 10–15','hypertrophy'),m('Farmer Carry','armor','3 × 30–45 sec','carry'),m('Thoracic + Ankle Reset','mobility','8 min','completion')]},
2:{focus:'Upper Volume + Zone 2 Bike',items:[x('Dumbbell Flat Bench Press','3 × 15','hypertrophy'),x('Meadows Row','3 × 8–12','hypertrophy'),x('Cable Fly — Mid','2 × 12–18','hypertrophy'),x('Single-Arm Lat Pulldown','3 × 10–15','hypertrophy'),x('Cable Lateral Raise','3 × 12–20','hypertrophy'),x('Rear-Delt Cable Fly','3 × 12–20','hypertrophy'),x('Rope Pressdown','3 × 10–15','hypertrophy'),x('Hammer Curl','3 × 10–15','hypertrophy'),m('Zone 2 Bike','engine','35–50 min','cardio'),m('Hip Rotation Flow','mobility','10 min','completion')]},
3:{focus:'Run + Posterior Chain',items:[m('Outdoor Run','engine','Runna prescription','cardio'),x('Bent-Knee Soleus Raise','2 × 12–15','armor'),x('Reverse Hyper','2 × 12–15','armor'),m('Bird Dog','armor','2 × 6/side','completion'),m('Run Recovery Flow','mobility','8–12 min','completion')]},
4:{focus:'Hinge + Upper + VO2',items:[x('Romanian Deadlift','3 × 6–10','strength'),x('Half-Kneeling Landmine Press','3 × 8–12','hypertrophy'),x('One-Arm Cable Row','3 × 8–12','hypertrophy'),x('Assisted Nordic Curl','2 × 4–8','armor'),x('Neutral-Grip Lat Pulldown','3 × 8–12','hypertrophy'),x('Bent-Knee Soleus Raise','3 × 12–20','armor'),x('Face Pull','2 × 12–20','armor'),x('Bayesian Cable Curl','2 × 10–15','hypertrophy'),x('Overhead Rope Extension','2 × 10–15','hypertrophy'),m('VO2 Intervals — Assault Bike','engine','6 × 2 min / 2 min easy','cardio'),m('Thoracic + Hip Reset','mobility','8 min','completion')]},
5:{focus:'Run + Recovery',items:[m('Outdoor Run','engine','Runna prescription','cardio'),m('Backward Sled Drag','armor','4 × 20–30 yd light','carry'),x('Tibialis Raise','2 × 20','armor'),m('YWTI','armor','1–2 rounds','completion'),m('Run Recovery Flow','mobility','12 min','completion')]},
6:{focus:'Athlete Day + Upper Volume + Long Ride',items:[x('Box Jump','3 × 3','armor'),x('Reverse Lunge','2–3 × 6–10/side','hypertrophy'),m('Backward Sled Drag','armor','3 × 30–40 yd','carry'),x('Reverse Hyper','2 × 12–15','armor'),x('Weighted Push-Up','3 × 8–20','hypertrophy'),x('Chin-Up','3 × 6–12','hypertrophy'),x('Single-Arm Cable Chest Press','2 × 10–15','hypertrophy'),x('T-Bar Row','2 × 10–15','hypertrophy'),x('Dumbbell Lateral Raise','2 × 15–25','hypertrophy'),m('Sandbag Bear-Hug Carry','armor','3 rounds','carry'),m('Outdoor Bike Ride','engine','60–90 min Zone 2','cardio'),m('Full-Body Reset Flow','mobility','10 min','completion')]}};
function x(name,rx,profile){const l=LIB.find(v=>v.name===name)||{id:name.toLowerCase().replace(/\W+/g,'-'),type:'strength'};return{...l,rx,profile,pillar:'strength'}}function m(name,pillar,rx,type){const l=LIB.find(v=>v.name===name)||{id:name.toLowerCase().replace(/\W+/g,'-'),type};return{...l,rx,pillar,type:type||l.type,profile:l.profile||'armor'}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}let S=load();S.logs=S.logs||{};S.done=S.done||{};S.readiness=S.readiness||{};S.settings=S.settings||{blockStart:todayISO(),week:1};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function logKey(date,id){return date+'__'+id}function doneKey(date,id){return date+'__'+id}
function currentWeek(){const start=new Date(S.settings.blockStart+'T12:00:00'),now=new Date();return Math.max(1,Math.min(10,Math.floor((now-start)/604800000)+1))}
function pillar(item){return item.pillar||(item.type==='cardio'?'engine':item.type==='completion'?'mobility':item.profile==='armor'?'armor':'strength')}
function inputsFor(item,prev){const rows=prev?.sets?.length?prev.sets:[{},{},{}];if(item.type==='completion')return'<button class="btn primary" onclick="completeItem(\''+item.id+'\')">Mark Complete</button>';let labels=['Load','Reps','Time','Distance'];if(item.type==='cardio')labels=['Minutes','Distance','Calories','Avg HR'];if(item.type==='carry')labels=['Load','Distance','Time','Trips'];if(item.type==='hold')labels=['Load','Seconds','Side','Notes'];return `<div class="labels"><i></i>${labels.map(x=>'<b>'+x+'</b>').join('')}</div><div class="sets">${rows.map((r,i)=>`<div class="setrow"><span>${i+1}</span>${labels.map((_,j)=>`<input data-i="${i}" data-j="${j}" value="${r[j]??''}" inputmode="decimal">`).join('')}</div>`).join('')}</div><div class="exactions"><button class="btn" onclick="addSet(this)">+ Set</button><button class="btn primary" onclick="saveExercise('${item.id}','${item.type}','${item.profile}','${item.rx.replaceAll("'","&#39;")}')">Save</button></div>`}
function latest(id){const arr=Object.values(S.logs).filter(x=>x.id===id).sort((a,b)=>b.date.localeCompare(a.date));return arr[0]}
function recommendation(item,last){if(!last)return'Log the first session to establish a baseline.';if(item.type!=='strength')return'Progress time, distance, calories or clean volume before load.';const nums=(last.sets||[]).map(r=>Number(r[1])||0),total=nums.reduce((a,b)=>a+b,0),base=(last.baseTotal||total),target=Math.ceil(base*1.2);if(last.stage==='set')return'Next: increase load modestly and reset to fewer sets/reps.';if(total>=target)return'Next: keep the load and add one set at the base rep target.';return`Stay at this load. Build ${Math.max(0,target-total)} more total reps before adding a set.`}
function pillarIcon(type){const icons={strength:'<svg viewBox="0 0 24 24"><path d="M6 9v6M3 10v4M18 9v6M21 10v4M6 12h12"/></svg>',engine:'<svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',armor:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/></svg>',mobility:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v5l-4 4M12 11l5 2M8 16l-2 5M16 13l2 7"/></svg>'};return icons[type]||'';}
function renderToday(){const d=new Date().getDay(),plan=weekPlan[d],date=todayISO();document.getElementById('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});document.getElementById('weekChip').innerHTML='<strong>Week '+currentWeek()+'</strong>';const grouped={strength:[],engine:[],armor:[],mobility:[]};plan.items.forEach(i=>grouped[pillar(i)].push(i));let html=`<div class="hero"><div class="eyebrow">${dayNames[d]} · Week ${currentWeek()} of 10</div><h2>${plan.focus}</h2><p>Volume-first progression. Earn load through quality work.</p><div class="readiness">${['green','yellow','red'].map(x=>`<button class="ready ${x} ${S.readiness[date]===x?'active':''}" onclick="setReady('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>`;for(const p of ['strength','engine','armor','mobility']){if(!grouped[p].length)continue;html+=`<div class="sectiontitle"><h3>${p[0].toUpperCase()+p.slice(1)}</h3><span>${grouped[p].filter(i=>S.done[doneKey(date,i.id)]).length}/${grouped[p].length}</span></div><div class="mission">`;grouped[p].forEach(item=>{const last=latest(item.id),done=S.done[doneKey(date,item.id)];html+=`<div class="missionhead"><span class="missionicon ${p}">${pillarIcon(p)}</span><div><strong>${item.name}</strong><small>${item.rx}</small></div><button class="toggle ${done?'done':''}" onclick="toggleExercise('${item.id}')">${done?'Done':'Open'}</button></div><div class="exercise" id="ex-${item.id}" style="display:none"><div class="exhead"><div><div class="exname">${item.name}</div><div class="rx">${item.rx}</div></div><div class="stage">${item.profile||item.type}</div></div><div class="last">${last?'Last: '+last.summary:'No history yet'}</div>${inputsFor(item,last)}<div class="recommend">${recommendation(item,last)}</div></div>`});html+='</div>'}document.getElementById('today').innerHTML=html}
function toggleExercise(id){const e=document.getElementById('ex-'+id);e.style.display=e.style.display==='none'?'block':'none'}function setReady(v){S.readiness[todayISO()]=v;save();renderToday()}
function addSet(btn){const sets=btn.closest('.exercise').querySelector('.sets'),n=sets.children.length;const row=sets.children[0].cloneNode(true);row.querySelector('span').textContent=n+1;row.querySelectorAll('input').forEach((x,j)=>{x.dataset.i=n;x.value=''});sets.appendChild(row)}
function saveExercise(id,type,profile,rx){const box=document.getElementById('ex-'+id),rows=[...box.querySelectorAll('.setrow')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value));const prev=latest(id),load=rows[0]?.[0]||'',reps=rows.map(r=>Number(r[1])||0),total=reps.reduce((a,b)=>a+b,0),baseTotal=prev?.baseTotal||total;let stage=prev?.stage||'rep';if(type==='strength'&&total>=Math.ceil(baseTotal*1.2)&&rows.length>(prev?.sets?.length||rows.length))stage='set';const rec={id,date:todayISO(),type,profile,rx,sets:rows,baseTotal,stage,summary:type==='strength'?`${load||'—'} · ${reps.filter(Boolean).join('/')||'logged'}`:`${rows[0].filter(Boolean).join(' · ')}`};S.logs[logKey(rec.date,id)]=rec;S.done[doneKey(rec.date,id)]=true;save();renderToday();renderProgress()}
function completeItem(id){S.done[doneKey(todayISO(),id)]=true;save();renderToday()}
function renderWeek(){const d=new Date().getDay();document.getElementById('week').innerHTML=`<div class="hero"><div class="eyebrow">Weekly architecture</div><h2>Train daily. Stress selectively.</h2><p>Four upper exposures, distributed lower work, three runs, two rides, one VO2 dose, daily armor and mobility.</p></div><div class="sectiontitle"><h3>This Week</h3></div><div class="weekgrid">${Object.entries(weekPlan).map(([k,v])=>`<div class="daycard ${+k===d?'today':''}"><div class="daytop"><strong>${dayNames[k]}</strong><small>${v.items.length} items</small></div><div class="dayfocus">${v.focus}</div><div class="pillrow">${[...new Set(v.items.map(pillar))].map(p=>`<span class="pill">${p}</span>`).join('')}</div></div>`).join('')}</div>`}
function renderLibrary(){const q=(document.getElementById('libSearch')?.value||'').toLowerCase(),fam=document.getElementById('famFilter')?.value||'all';const groups={};LIB.filter(x=>(fam==='all'||x.family===fam)&&(!q||x.name.toLowerCase().includes(q)||x.family.toLowerCase().includes(q))).forEach(x=>(groups[x.family]??=[]).push(x));document.getElementById('library').innerHTML=`<div class="hero"><div class="eyebrow">Jay-approved movement catalog</div><h2>${LIB.length} movements</h2><p>Built from your equipment, preferences and constraints—not a generic 600-exercise database.</p></div><div class="sectiontitle"><h3>Armory</h3></div><div class="librarytools"><input id="libSearch" placeholder="Search movement" value="${q}" oninput="renderLibrary()"><select id="famFilter" onchange="renderLibrary()"><option value="all">All families</option>${Object.keys(FAMILIES).map(f=>`<option ${fam===f?'selected':''}>${f}</option>`).join('')}</select></div>${Object.entries(groups).map(([f,arr])=>`<div class="family"><h3>${f}</h3>${arr.map(x=>`<div class="libitem"><div><strong>${x.name}</strong><small>${x.type} · ${x.profile}</small></div><span class="tag">${x.family}</span></div>`).join('')}</div>`).join('')}`}
function renderProgress(){const logs=Object.values(S.logs).sort((a,b)=>b.date.localeCompare(a.date)),weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay());const recent=logs.filter(x=>new Date(x.date)>=weekStart);const done=Object.keys(S.done).filter(k=>k.startsWith(todayISO().slice(0,8))).length;const tracked=new Set(logs.map(x=>x.id)).size;document.getElementById('progress').innerHTML=`<div class="hero"><div class="eyebrow">Progress tracker</div><h2>Performance, not paperwork</h2><p>Strength, reps, sets, time, distance and calories—only where those metrics matter.</p></div><div class="sectiontitle"><h3>Snapshot</h3></div><div class="stats"><div class="stat"><b>${recent.length}</b><small>logs this week</small></div><div class="stat"><b>${tracked}</b><small>movements tracked</small></div><div class="stat"><b>${logs.length}</b><small>total logs</small></div><div class="stat"><b>${done}</b><small>completions this month</small></div></div><div class="sectiontitle"><h3>Logbook</h3></div>${logs.length?`<div class="history">${logs.slice(0,20).map(x=>`<div class="histrow"><span>${x.date}</span><span>${LIB.find(v=>v.id===x.id)?.name||x.id}</span><span>${x.summary}</span></div>`).join('')}</div>`:'<div class="empty">Complete a tracked movement to begin history.</div>'}`}
function showSettings(){document.getElementById('sheet').innerHTML=`<h3>Settings & Data</h3><div class="formgrid"><label class="full">Block start<input id="blockStart" type="date" value="${S.settings.blockStart}"></label><label>Current focus<input value="Flat Bench" disabled></label><label>Block length<input value="10 weeks" disabled></label><div class="full note">Volume-first defaults: build approximately 20% more total reps at the same load, add one set, then increase load and reset volume.</div></div><div class="footeractions"><button class="btn" onclick="exportData()">Export</button><button class="btn" onclick="document.getElementById('importFile').click()">Import</button><button class="btn primary" onclick="saveSettings()">Save</button></div><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetData()">Reset v2 Data</button>`;document.getElementById('modal').classList.add('show')}
function saveSettings(){S.settings.blockStart=document.getElementById('blockStart').value||todayISO();save();closeModal();renderAll()}function closeModal(){document.getElementById('modal').classList.remove('show')}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='dha50-engine-room-2-0-'+todayISO()+'.json';a.click()}function importData(e){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();closeModal();renderAll()}catch{alert('Could not read file')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete all DHA-50 v2 data on this device?')){localStorage.removeItem(KEY);location.reload()}}
function renderAll(){renderToday();renderWeek();renderLibrary();renderProgress()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.getElementById('settingsBtn').onclick=showSettings;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};renderAll();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script></body></html>
